app = 'sconto-v2-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  SCONTO_API_ORIGENES = 'https://d1512pb.github.io'
  SCONTO_API_PROFECO = '0'

[[mounts]]
  source = 'sconto_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 12
    hard_limit = 24
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
