  - evento_id: BF2025
    nombre: Buen Fin 2025
    inicio: 2025-11-13
    fin: 2025-11-17
    fuente_fechas: Avance 1 (QQP 2025)
  - evento_id: BF2026
    nombre: Buen Fin 2026
