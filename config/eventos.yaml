# Ventanas relativas a D0 (primer día del evento), idénticas al Avance 1:
#   base: D-60 a D-15 · previo: D-14 a D-1 · evento: D0 al último día
#   posterior: 14 días tras el último día (solo diagnóstico; incluye Black Friday / Cyber Monday)
ventanas_relativas:
  base: [-60, -15]
  previo: [-14, -1]
  posterior_dias: 14

eventos:
