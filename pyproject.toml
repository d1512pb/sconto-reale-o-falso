[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sconto"
version = "0.1.0"
description = "Sconto reale o falso: recolección multifuente de precios de tecnología (ESCOM-IPN, Minería de Datos)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
