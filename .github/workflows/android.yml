name: Verificar app Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compilar y revisar Android
        run: bash android/gradlew -p android :app:assembleRelease :app:testDebugUnitTest :app:lintRelease --console=plain --max-workers=2
      - name: Guardar resultados de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-android
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-release.*
          retention-days: 14
