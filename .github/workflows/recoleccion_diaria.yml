name: Recolección diaria de precios

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      solo_analitica:
        description: 'Actualizar análisis y web desde el último ZIP, sin recolectar'
        type: boolean
        required: false
        default: false
      max_productos:
        description: '0 = lista fija completa; otro valor limita una prueba'
        required: false
        default: '0'

permissions:
  contents: write
  issues: write

concurrency:
  group: recoleccion
  cancel-in-progress: false

jobs:
  recolectar:
    if: ${{ !inputs.solo_analitica }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCONTO_CONTACTO: +https://github.com/${{ github.repository }}
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Verificar infraestructura sin red
        run: |
          python -m pytest tests/test_infraestructura.py tests/test_operacion.py tests/test_evidencia.py \
            tests/test_servicio.py tests/test_auditar_recoleccion.py \
            tests/test_qqp.py::test_indice_404_usa_enlace_oficial_previamente_descargado -q
      - name: Recolectar
        continue-on-error: true
        env:
          LIMITE: ${{ inputs.max_productos || '0' }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          argumentos=(--entorno github)
          if ! [[ "$LIMITE" =~ ^[0-9]+$ ]]; then exit 2; fi
          if [ "$LIMITE" -gt 0 ]; then argumentos+=(--max-productos "$LIMITE"); fi
          python -m sconto.run_diario "${argumentos[@]}" --solo-si-falta
      - name: Preparar dataset, reportes y paquete
        run: python -m sconto.operacion --entorno github --solo-preparar
      - name: Validar dataset antes de publicarlo
        run: python -m pytest tests/test_dataset.py tests/test_exportar.py -q
      - name: Guardar snapshot de datos
        run: |
          git config user.name sconto-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data reports DICCIONARIO.md
          if [ -f ALERTA.md ] || git ls-files --error-unmatch ALERTA.md >/dev/null 2>&1; then git add -A ALERTA.md; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "datos: recolección $(date +%F) (GitHub Actions)"
          for intento in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((intento * 20))
          done
          exit 1
      - name: Publicar paquete consistente para Colab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view datos >/dev/null 2>&1 || gh release create datos --title 'Datos diarios para Colab' \
            --notes 'Snapshot con parquet, CSV y SHA-256. No incluye credenciales ni crudos de tiendas. Ver README.'
          paquete="data/exportaciones/sconto_colab_$(date +%F).zip"
          cp "$paquete" data/exportaciones/sconto_colab_actual.zip
          gh release upload datos "$paquete" data/exportaciones/sconto_colab_actual.zip --clobber
      - name: Conservar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-${{ github.run_id }}
          path: |
            logs/*.log
            data/estado/
          retention-days: 7
      - name: Avisar fallos consecutivos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ALERTA.md ]; then
            gh label create alerta-recoleccion --color B60205 --force
            abiertos=$(gh issue list --label alerta-recoleccion --state open --json number --jq length)
            if [ "$abiertos" = '0' ]; then
              gh issue create --title "Alerta de recolección $(date +%F)" --body-file ALERTA.md --label alerta-recoleccion
            fi
          fi
      - name: Comprobar cobertura diaria real
        run: python -m sconto.operacion --entorno github --verificar

  analitica:
    needs: recolectar
    if: ${{ always() && !cancelled() && (needs.recolectar.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.solo_analitica)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Mexico_City
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar ETL analítico
        run: |
          python -m pip install -r requirements-analitica.txt pytest
          python -m pip install -e .
      - name: Obtener snapshot consistente publicado por recolección
        run: |
          mkdir -p data/exportaciones
          gh release download datos --pattern sconto_colab_actual.zip --dir data/exportaciones
      - name: Producir tablas para web con el mismo ETL del Colab
        run: |
          python -m sconto.mart --paquete data/exportaciones/sconto_colab_actual.zip
          python -m pytest tests/test_mineria_web.py tests/test_publicar_web.py -q
      - name: Publicar entrega analítica
        run: |
          python - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          p = Path('data/analitica/sconto_web.zip')
          h = hashlib.sha256(p.read_bytes()).hexdigest()[:12]
          shutil.copy2(p, p.with_name(f'sconto_web_run_${{ github.run_id }}_{h}.zip'))
          shutil.copy2(p, p.with_name('sconto_web_actual.zip'))
          PY
          gh release upload datos data/analitica/sconto_web_run_*.zip data/analitica/sconto_web_actual.zip --clobber
      - name: Construir consulta pública
        run: python -m sconto.publicar_web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data/analitica/site
      - name: Conservar contrato y evaluación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analitica-${{ github.run_id }}
          path: |
            data/analitica/manifest.json
            data/analitica/modelo.json
            data/analitica/evaluacion_modelo.csv.gz
            data/analitica/casos_para_revision.csv
          retention-days: 30

  web:
    needs: analitica
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Desplegar consulta pública
        id: deployment
        uses: actions/deploy-pages@v4
