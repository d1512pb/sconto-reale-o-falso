name: Recolección diaria de precios

on:
  schedule:
    - cron: '17 13 * * *'   # 07:17 hora CDMX: pasada diaria
    - cron: '17 1 * * *'    # 19:17 hora CDMX: 2a pasada; run_diario la ignora fuera del 10–20 de noviembre
  workflow_dispatch:
    inputs:
      fuentes:
        description: 'Fuentes separadas por espacio (vacío = las del entorno github)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: recoleccion
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SCONTO_CONTACTO: +https://github.com/${{ github.repository }}
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Recolectar
        run: |
          PASADA=1
          if [ "${{ github.event.schedule }}" = "17 1 * * *" ]; then PASADA=2; fi
          if [ -n "${{ github.event.inputs.fuentes }}" ]; then
            python -m sconto.run_diario --entorno github --pasada $PASADA --fuentes ${{ github.event.inputs.fuentes }}
          else
            python -m sconto.run_diario --entorno github --pasada $PASADA
          fi

      - name: Reconstruir dataset gold
        if: always()
        run: python -m sconto.dataset || echo "dataset no reconstruido (ver log)"

      - name: Guardar datos en el repositorio
        if: always()
        run: |
          git config user.name "sconto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports ALERTA.md 2>/dev/null || git add -A data reports
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "datos: recolección $(date +%F) (GitHub Actions)"
          for i in 1 2 3; do
            git pull --rebase --strategy-option=theirs && git push && exit 0
            sleep $((i * 20))
          done
          exit 1

      - name: Abrir issue si una fuente falla dos días seguidos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ALERTA.md ]; then
            abiertos=$(gh issue list --label alerta-recoleccion --state open --json number --jq length || echo 0)
            if [ "$abiertos" = "0" ]; then
              gh label create alerta-recoleccion --color B60205 --force >/dev/null 2>&1 || true
              gh issue create --title "Alerta de recolección $(date +%F)" --body-file ALERTA.md --label alerta-recoleccion
            fi
          fi
