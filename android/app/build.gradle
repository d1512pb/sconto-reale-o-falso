plugins { id 'com.android.application' }

android {
    namespace 'mx.sconto.app'
    compileSdk 36
    defaultConfig {
        applicationId 'mx.sconto.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
